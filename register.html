<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Sartoria client account. Save anatomical measurements, track bespoke stitching orders, and book private fittings.">
  <title>Register Account | Sartoria</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Main Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-sand d-flex align-items-center min-vh-100 py-5 position-relative">

  <div class="position-absolute top-0 end-0 p-3 d-flex gap-2">
    <button class="btn btn-icon-square rtl-toggle-btn" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR">
      <span class="rtl-text fw-bold">RTL</span>
    </button>
    <button class="btn btn-icon-square theme-toggle-btn" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars"></i>
    </button>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card bg-surface border-0 shadow-lg rounded-4 p-4 p-md-5">
          <!-- Logo -->
          <div class="text-center mb-4">
            <a class="brand-logo justify-content-center mb-3 text-decoration-none" href="index.html">
              <span class="brand-icon"><i class="bi bi-scissors"></i></span>
              <span class="text-heading" style="line-height: 1;">SARTORIA</span>
            </a>
            <h1 class="h4 fw-bold mb-1">Join the Atelier</h1>
            <p class="text-muted small">Create an account to save measurements and manage appointments.</p>
          </div>

          <!-- Register Form -->
          <form id="registerForm" class="needs-validation" novalidate>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="regFirstName" class="form-label form-label-custom">First Name *</label>
                <input type="text" class="form-control form-control-custom" id="regFirstName" placeholder="Eleanor" required>
              </div>
              <div class="col-md-6">
                <label for="regLastName" class="form-label form-label-custom">Last Name *</label>
                <input type="text" class="form-control form-control-custom" id="regLastName" placeholder="Vance" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="regEmail" class="form-label form-label-custom">Email Address *</label>
              <div class="input-group">
                <span class="input-group-text bg-sand"><i class="bi bi-envelope text-gold"></i></span>
                <input type="email" class="form-control form-control-custom" id="regEmail" placeholder="eleanor@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="regPhone" class="form-label form-label-custom">Phone Number *</label>
              <div class="input-group">
                <span class="input-group-text bg-sand"><i class="bi bi-telephone text-gold"></i></span>
                <input type="tel" class="form-control form-control-custom" id="regPhone" placeholder="+1 (555) 000-0000" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="regPassword" class="form-label form-label-custom">Create Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-sand"><i class="bi bi-lock text-gold"></i></span>
                <input type="password" class="form-control form-control-custom" id="regPassword" placeholder="At least 8 characters" required minlength="8">
                <button class="btn btn-outline-secondary password-toggle-btn" type="button" aria-label="Show password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required>
              <label class="form-check-label small text-muted" for="termsCheck">
                I agree to the <a href="#" class="text-gold text-decoration-none">Terms of Service</a> & <a href="#" class="text-gold text-decoration-none">Privacy Policy</a>
              </label>
            </div>

            <button type="submit" class="btn-custom btn-gold btn-custom-pill w-100 mb-3 shadow-sm">
              <i class="bi bi-person-plus"></i> Create Client Profile
            </button>
          </form>

          <div class="text-center mt-3">
            <p class="small text-muted mb-0">
              Already have an account? <a href="login.html" class="text-gold fw-bold text-decoration-none">Sign In</a>
            </p>
            <div class="mt-3">
              <a href="index.html" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Return to Homepage</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
