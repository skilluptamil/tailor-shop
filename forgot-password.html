<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your password for Sartoria client portal.">
  <title>Reset Password | Sartoria</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Main Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-sand d-flex align-items-center min-vh-100 py-5 position-relative">

  <div class="position-absolute top-0 end-0 p-3 d-flex gap-2">
    <button class="btn btn-icon-square rtl-toggle-btn" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR">
      <span class="rtl-text fw-bold">RTL</span>
    </button>
    <button class="btn-icon-square theme-toggle-btn" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars"></i>
    </button>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card bg-surface border-0 shadow-lg rounded-4 p-4 p-md-5">
          <div class="text-center mb-4">
            <a class="brand-logo justify-content-center mb-3 text-decoration-none" href="index.html">
              <span class="brand-icon"><i class="bi bi-scissors"></i></span>
              <span class="text-heading" style="line-height: 1;">SARTORIA</span>
            </a>
            <h1 class="h4 fw-bold mb-1">Reset Password</h1>
            <p class="text-muted small">Enter your email and we will send a secure recovery link.</p>
          </div>

          <form id="forgotPasswordForm" class="needs-validation" novalidate>
            <div class="mb-4">
              <label for="resetEmail" class="form-label form-label-custom">Account Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-sand"><i class="bi bi-envelope text-gold"></i></span>
                <input type="email" class="form-control form-control-custom" id="resetEmail" placeholder="name@example.com" required>
              </div>
            </div>

            <button type="submit" class="btn-custom btn-gold btn-custom-pill w-100 mb-3 shadow-sm">
              <i class="bi bi-send-check"></i> Send Reset Link
            </button>
          </form>

          <div class="text-center mt-3">
            <a href="login.html" class="text-gold fw-bold text-decoration-none small"><i class="bi bi-arrow-left"></i> Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
