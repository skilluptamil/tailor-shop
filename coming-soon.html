<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sartoria Autumn/Winter Haute Couture Collection Launching Soon. Subscribe for VIP invitation.">
  <title>Coming Soon | Sartoria</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Main Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-dark-atelier text-white d-flex align-items-center min-vh-100 py-5 position-relative">

  <div class="position-absolute top-0 end-0 p-3 d-flex gap-2">
    <button class="btn btn-icon-square rtl-toggle-btn" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR">
      <span class="rtl-text fw-bold">RTL</span>
    </button>
    <button class="btn btn-icon-square theme-toggle-btn" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars"></i>
    </button>
  </div>

  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <a class="brand-logo justify-content-center mb-4 text-decoration-none" href="index.html">
          <span class="brand-icon"><i class="bi bi-scissors"></i></span>
          <span class="text-white" style="line-height: 1;">SARTORIA</span>
        </a>

        <div class="badge badge-gold mb-3">Seasonal Launch</div>
        <h1 class="display-4 fw-bold font-editorial mb-3">Something Sublime is Being Stitched</h1>
        <p class="text-light opacity-75 fs-5 mb-5 mx-auto" style="max-width: 600px;">
          Our new Autumn/Winter Haute Couture Collection & Bespoke Digital Fitting Salon will unveil shortly.
        </p>

        <!-- Live Countdown Timer -->
        <div id="countdownTimer" class="d-flex justify-content-center gap-3 gap-md-4 mb-5">
          <div class="p-3 bg-surface-dark border border-secondary border-opacity-25 rounded-4 shadow" style="min-width: 85px;">
            <div id="countDays" class="display-5 fw-bold text-gold">30</div>
            <small class="text-muted text-uppercase fw-semibold" style="font-size: 0.75rem;">Days</small>
          </div>
          <div class="p-3 bg-surface-dark border border-secondary border-opacity-25 rounded-4 shadow" style="min-width: 85px;">
            <div id="countHours" class="display-5 fw-bold text-gold">14</div>
            <small class="text-muted text-uppercase fw-semibold" style="font-size: 0.75rem;">Hours</small>
          </div>
          <div class="p-3 bg-surface-dark border border-secondary border-opacity-25 rounded-4 shadow" style="min-width: 85px;">
            <div id="countMinutes" class="display-5 fw-bold text-gold">45</div>
            <small class="text-muted text-uppercase fw-semibold" style="font-size: 0.75rem;">Minutes</small>
          </div>
          <div class="p-3 bg-surface-dark border border-secondary border-opacity-25 rounded-4 shadow" style="min-width: 85px;">
            <div id="countSeconds" class="display-5 fw-bold text-gold">20</div>
            <small class="text-muted text-uppercase fw-semibold" style="font-size: 0.75rem;">Seconds</small>
          </div>
        </div>

        <!-- VIP Notify Form -->
        <div class="card bg-surface-dark border border-secondary border-opacity-25 rounded-4 p-4 max-w-700 mx-auto mb-4">
          <h2 class="h5 text-white mb-2">Be First in Line for the VIP Lookbook</h2>
          <form class="newsletter-form" id="newsletterForm">
            <div class="input-group">
              <input type="email" class="form-control form-control-custom" placeholder="Enter your email" required>
              <button class="btn btn-gold px-4" type="submit">Get Notified</button>
            </div>
          </form>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
          <a href="#" class="social-icon-link bg-surface-dark text-white"><i class="bi bi-instagram"></i></a>
          <a href="#" class="social-icon-link bg-surface-dark text-white"><i class="bi bi-facebook"></i></a>
          <a href="#" class="social-icon-link bg-surface-dark text-white"><i class="bi bi-pinterest"></i></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
